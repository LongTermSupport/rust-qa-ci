name: Public safety

# Keeps this repository safe to publish: a secret scan (gitleaks) and a denylist scan
# (scripts/public-safety-scan.sh) over the tree and the whole history on every push and pull
# request, and over issue, pull request and comment text when it is written. The denylist is never
# committed; its content comes from the RQACI_DENYLIST repository secret (docs/denylist.example
# shows the format). Findings print the location and denylist line number, never the term.
on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
    types: [opened, edited, reopened, synchronize]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-safety-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  secrets:
    name: Secret scan (gitleaks)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          cd "${RUNNER_TEMP}/gitleaks"
          gh release download "v${GITLEAKS_VERSION}" -R gitleaks/gitleaks \
            -p "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -p "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          echo "${PWD}" >> "${GITHUB_PATH}"
      - run: scripts/secret-scan.sh --history
      - run: scripts/secret-scan.sh --tree

  denylist:
    name: Denylist scan (tree and history)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write the denylist outside the checkout
        env:
          DENYLIST: ${{ secrets.RQACI_DENYLIST }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: .github/scripts/write-denylist.sh
      - name: Scan the working tree
        if: env.RQACI_DENYLIST != ''
        run: scripts/public-safety-scan.sh --tree
      - name: Scan every ref, commit, identity and tag message
        if: env.RQACI_DENYLIST != ''
        run: scripts/public-safety-scan.sh --history
      - name: Scan the pull request title and body
        if: env.RQACI_DENYLIST != '' && github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "${TITLE}" "${BODY}" | scripts/public-safety-scan.sh --stdin

  text:
    name: Denylist scan (issue and comment text)
    # Only text written by maintainers: they are the ones who could leak private detail, and scanning
    # anyone's text would let outsiders probe the denylist through public job results.
    if: >-
      (github.event_name == 'issues' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the denylist outside the checkout
        env:
          DENYLIST: ${{ secrets.RQACI_DENYLIST }}
          FORK_PR: "false"
        run: .github/scripts/write-denylist.sh
      - name: Scan the text
        env:
          TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          BODY: ${{ github.event.comment.body || github.event.issue.body }}
        run: printf '%s\n%s\n' "${TITLE}" "${BODY}" | scripts/public-safety-scan.sh --stdin
