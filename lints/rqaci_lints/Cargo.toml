[package]
name = "rqaci_lints"
version = "0.3.1"
authors = ["rust-qa-ci contributors"]
description = "Type-aware Dylint lints bundled with rust-qa-ci"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "21baba9c10c5d179915cae82e6247bc2337872fb" }
dylint_linting = "6.0"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
dylint_testing = "6.0"

[package.metadata.rust-analyzer]
rustc_private = true

[workspace]
